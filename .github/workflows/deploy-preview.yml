name: Deploy JoTrip V7 preview only
on:
  push:
    branches: [feat/quote-single-domain-mvp]
    paths:
      - .github/workflows/deploy-preview.yml
      - wrangler.jsonc
      - src/**
      - public/**
      - migrations/**
      - tests/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jotrip-quote-preview
  cancel-in-progress: false
jobs:
  deploy:
    name: Verify, migrate preview D1, deploy preview Worker
    runs-on: ubuntu-latest
    environment: jotrip-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CLI and run app tests
        run: |
          npm install --ignore-scripts
          npm test
          npx wrangler deploy --env preview --dry-run
      - name: Ensure Cloudflare credentials are connected
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub repository/environment secrets. Never share secrets in code or chat.'
            exit 1
          fi
      - name: Verify preview target and read-only gates
        run: |
          node - <<'JS'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const p=c.env.preview;
          if(p.name!=='jotrip-quote-preview'||p.d1_databases?.[0]?.database_name!=='jotrip-quote-preview-db'||p.d1_databases[0].database_id!=='5242a0ac-9d8a-4013-8cad-806c1e37ef90') throw Error('Preview target mismatch');
          if(p.vars.PREVIEW_LOCK!=='false'||p.vars.ENABLE_STAFF_PREVIEW!=='false'||p.vars.ALLOW_PREVIEW_SUBMISSIONS!=='false'||p.vars.PRIVACY_NOTICE_APPROVED!=='false') throw Error('Unsafe preview');
          console.log('Verified public visual preview only; guest intake and staff Studio remain disabled.');
          JS
      # This release is VISUAL-ONLY: submit, staff, and privacy gates are all closed.
      # Attempt preview migrations, but a restricted D1 token must not block static visual QA.
      # Never use this fallback if any customer or staff functionality is enabled.
      - name: Attempt preview D1 migrations (read-only visual preview may proceed if denied)
        id: migrate
        continue-on-error: true
        run: npx wrangler d1 migrations apply jotrip-quote-preview-db --remote --env preview
      - name: Warn if preview D1 migration was blocked
        if: steps.migrate.outcome != 'success'
        run: |
          echo '::warning::Preview D1 migration has not completed. Public visual QA only; do not enable forms or staff. Add Cloudflare D1 Edit permission to the API token and rerun this workflow.'
          echo 'D1 migration pending. Visual-only preview remains permitted; customer intake and staff stay disabled.' >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy read-only preview Worker only
        run: npx wrangler deploy --env preview
      - name: Smoke-check deployed V8 HTML, media and locked APIs
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://jotrip-quote-preview.kenzuko.workers.dev'
          curl -fLsS --retry 2 --max-time 25 "$BASE/bespoke" -o /tmp/jotrip-v8-page.html
          grep -q 'JoTrip Bespoke' /tmp/jotrip-v8-page.html
          curl -fLsS --max-time 25 "$BASE/bespoke/app.js" -o /tmp/jotrip-v8.js
          curl -fLsS --max-time 25 "$BASE/bespoke/app.css" -o /tmp/jotrip-v8.css
          curl -fLsS --max-time 25 "$BASE/bespoke/assets/coast.webp" -o /tmp/jotrip-v8-hero.webp
          curl -fLsS --max-time 25 "$BASE/bespoke/assets/journal-private.webp" -o /tmp/jotrip-v8-journal.webp
          curl -fLsS --max-time 25 "$BASE/bespoke/assets/local-story-motion.webp" -o /tmp/jotrip-local-story-motion.webp
          curl -fLsS --max-time 25 "$BASE/bespoke/assets/local-story-poster.webp" -o /tmp/jotrip-local-story-poster.webp
          grep -q 'class="screen home-screen local-landing"' /tmp/jotrip-v8.js
          grep -q 'local-story-motion.webp' /tmp/jotrip-v8.js
          grep -q 'JoTrip Bespoke V8' /tmp/jotrip-v8.css
          test "$(wc -c < /tmp/jotrip-v8-hero.webp)" -gt 100000
          test "$(wc -c < /tmp/jotrip-v8-journal.webp)" -gt 100000
          test "$(wc -c < /tmp/jotrip-local-story-motion.webp)" -gt 100000
          test "$(wc -c < /tmp/jotrip-local-story-poster.webp)" -gt 10000
          CODE=$(curl -sS --max-time 25 -o /tmp/jotrip-v8-submit.json -w '%{http_code}' -X POST "$BASE/bespoke/api/submit" -H "Origin: $BASE" -H 'Content-Type: application/json' --data '{}')
          test "$CODE" = '503'
          CODE=$(curl -sS --max-time 25 -o /tmp/jotrip-v8-staff.json -w '%{http_code}' "$BASE/api/staff/quotes")
          test "$CODE" = '403'
          echo 'Bespoke story HTML, CSS, JS, original media assets and closed customer/staff APIs verified live.' >> "$GITHUB_STEP_SUMMARY"
      - name: Print preview URL and restrictions
        run: |
          echo 'Read-only visual preview: https://jotrip-quote-preview.kenzuko.workers.dev/bespoke' >> "$GITHUB_STEP_SUMMARY"
          echo 'Customer submission OFF. Staff Quote Studio OFF. Privacy notice approval OFF.' >> "$GITHUB_STEP_SUMMARY"
