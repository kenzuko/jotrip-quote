name: JoTrip Quote CI
on:
  push:
    branches: [feat/quote-single-domain-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npx wrangler deploy --env preview --dry-run
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
